name: Win7 (Fixed WebView2) Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target arch'
        required: true
        type: choice
        options:
          - x64
          - x86
          - arm64
        default: x64
      webview2_version:
        description: "WebView2 FixedVersionRuntime version (can downgrade for Win7)"
        required: true
        type: string
        default: "133.0.3065.92"

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build-windows-fixed-webview2:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ github.event.inputs.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ github.event.inputs.arch }}-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: win7-${{ runner.os }}-${{ github.event.inputs.arch }}
          workspaces: |
            . -> target

      - name: Install deps
        run: pnpm i

      - name: Determine rust target
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch }}"
          if ($arch -eq 'x64') { echo "TARGET=x86_64-pc-windows-msvc" >> $env:GITHUB_ENV }
          elseif ($arch -eq 'x86') { echo "TARGET=i686-pc-windows-msvc" >> $env:GITHUB_ENV }
          elseif ($arch -eq 'arm64') { echo "TARGET=aarch64-pc-windows-msvc" >> $env:GITHUB_ENV }
          else { throw "Unknown arch: $arch" }

      - name: Add Rust Target
        shell: pwsh
        run: |
          rustup target add ${{ env.TARGET }}

      - name: Prebuild
        run: pnpm run prebuild ${{ env.TARGET }}

      - name: Cache WebView2 Fixed Runtime CAB
        id: webview2-cache
        uses: actions/cache@v5
        with:
          path: Microsoft.WebView2.FixedVersionRuntime.${{ github.event.inputs.webview2_version }}.${{ github.event.inputs.arch }}.cab
          key: webview2-${{ runner.os }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.webview2_version }}

      - name: Prepare Fixed WebView2 Runtime
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch }}"
          $ver = "${{ github.event.inputs.webview2_version }}"
          $hit = "${{ steps.webview2-cache.outputs.cache-hit }}"
          if ($hit -eq 'true') {
            powershell -ExecutionPolicy Bypass -File .\scripts\windows\prepare-fixed-webview2.ps1 -Arch $arch -Version $ver -SkipDownload
          } else {
            powershell -ExecutionPolicy Bypass -File .\scripts\windows\prepare-fixed-webview2.ps1 -Arch $arch -Version $ver
          }

      - name: Build (NSIS, no updater json)
        shell: pwsh
        run: pnpm tauri build --target ${{ env.TARGET }} --config src-tauri/tauri.win7.conf.json
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Portable Bundle (Fixed WebView2)
        shell: pwsh
        run: pnpm portable-fixed-webview2 ${{ env.TARGET }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win7-fixed-webview2-${{ github.event.inputs.arch }}
          archive: false
          path: |
            target/${{ env.TARGET }}/release/bundle/nsis/*setup*
            Clash.Verge_*_fixed_webview2_portable.zip
